<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Copper circular frame -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#B87333" stroke-width="4"/>
  <circle cx="50" cy="50" r="36" fill="none" stroke="#CD7F32" stroke-width="2"/>
  
  <!-- Arrow pointing up and right, crossing the circle -->
  <g stroke="#B87333" stroke-width="3" fill="#B87333">
    <line x1="15" y1="85" x2="80" y2="20"/>
    <polygon points="80,20 72,28 85,15 80,20 72,15" fill="#B87333"/>
  </g>
  
  <!-- Stylized S shape - circuit board style -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main S curve in blue -->
    <path d="M 32 38 C 32 28, 68 28, 68 38 C 68 48, 32 48, 32 58 C 32 68, 68 68, 68 58" 
          stroke="#4A90E2" fill="none"/>
    <!-- Inner S curve in grey -->
    <path d="M 38 42 C 38 36, 62 36, 62 42 C 62 48, 38 48, 38 54 C 38 60, 62 60, 62 54" 
          stroke="#7F8C8D" fill="none" stroke-width="1.5"/>
  </g>
  
  <!-- Small orange square in the lower part of the S -->
  <rect x="46" y="54" width="8" height="8" fill="#FF8C00" rx="1"/>
  
  <!-- Circuit connection points -->
  <g fill="#4A90E2">
    <circle cx="32" cy="38" r="2"/>
    <circle cx="68" cy="38" r="2"/>
    <circle cx="32" cy="58" r="2"/>
    <circle cx="68" cy="58" r="2"/>
  </g>
</svg>