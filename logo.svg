<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Copper circular frame -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#B87333" stroke-width="3"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#CD7F32" stroke-width="2"/>
  
  <!-- Arrow pointing up and right, crossing the circle -->
  <g stroke="#B87333" stroke-width="2" fill="#B87333">
    <line x1="20" y1="80" x2="75" y2="25" stroke-width="3"/>
    <polygon points="75,25 70,30 80,20 75,25 70,20" fill="#B87333"/>
  </g>
  
  <!-- Stylized S shape inside the circle -->
  <g fill="none" stroke-width="2">
    <path d="M 30 35 Q 45 25, 60 35 Q 75 45, 60 55 Q 45 65, 30 55 Q 15 45, 30 35" 
          stroke="#4A90E2" fill="rgba(74, 144, 226, 0.2)"/>
    <path d="M 35 40 Q 45 35, 55 40 Q 65 45, 55 50 Q 45 55, 35 50 Q 25 45, 35 40" 
          stroke="#7F8C8D" fill="rgba(127, 140, 141, 0.1)"/>
  </g>
  
  <!-- Small orange square in the lower part of the S -->
  <rect x="45" y="52" width="6" height="6" fill="#FF8C00" rx="1"/>
  
  <!-- Additional circuit-like details -->
  <g stroke="#4A90E2" stroke-width="1" fill="none" opacity="0.6">
    <circle cx="25" cy="35" r="2"/>
    <circle cx="75" cy="65" r="2"/>
    <line x1="25" y1="35" x2="30" y2="35"/>
    <line x1="75" y1="65" x2="70" y2="65"/>
  </g>
</svg>